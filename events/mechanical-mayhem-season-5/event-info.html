<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Info - GSCRL Mechanical Mayhem — Season 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-8);
      box-sizing: border-box;
      overflow: hidden;
      background: linear-gradient(135deg, var(--gscrl-darker) 0%, var(--gscrl-dark) 100%);
    }

    .info-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      gap: var(--space-6);
    }

    /* Header */
    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .info-title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      color: var(--gscrl-light);
      letter-spacing: 0.05em;
    }

    .info-title .highlight { color: var(--gscrl-primary); }

    .day-badge {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--gscrl-primary);
      color: var(--gscrl-dark);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Content panel */
    .content-panel {
      width: 100%;
      background: rgba(26, 26, 46, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      backdrop-filter: blur(10px);
    }

    .panel-label {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      color: var(--gscrl-primary);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid rgba(255, 107, 107, 0.3);
    }

    /* Schedule view */
    .schedule-list { display: flex; flex-direction: column; gap: var(--space-3); }

    .schedule-item {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-md);
    }

    .schedule-item.active {
      border-color: var(--gscrl-primary);
      background: rgba(255, 107, 107, 0.1);
    }

    .schedule-time {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      color: var(--gscrl-secondary);
      min-width: 90px;
    }

    .schedule-text { flex: 1; }

    .schedule-name {
      font-family: var(--font-display);
      font-size: var(--text-base);
      color: var(--gscrl-light);
      letter-spacing: 0.03em;
    }

    .schedule-sub {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--gscrl-gray);
      margin-top: 2px;
    }

    .schedule-badge {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: var(--gscrl-primary);
      color: var(--gscrl-dark);
    }

    /* Sponsors view */
    .sponsors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-3);
    }

    .sponsor-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: var(--text-sm);
      color: var(--gscrl-light);
      letter-spacing: 0.05em;
      text-align: center;
      min-height: 72px;
    }

    /* Event overview */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
    }

    .overview-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-4);
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-md);
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      color: var(--gscrl-primary);
      text-shadow: var(--glow-intensity) var(--glow-color);
    }

    .stat-label {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--gscrl-gray);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* Social footer */
    .social-footer {
      display: flex;
      gap: var(--space-6);
      padding: var(--space-3) var(--space-6);
      background: rgba(26,26,46,0.6);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-full);
    }

    .social-item {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--gscrl-secondary);
    }

    /* View selector */
    .view-selector {
      position: fixed;
      bottom: var(--space-4);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: var(--space-2);
      background: rgba(26,26,46,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-full);
      padding: var(--space-2);
      z-index: 100;
    }

    .view-btn {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: var(--space-2) var(--space-4);
      border: none;
      border-radius: var(--radius-full);
      background: transparent;
      color: var(--gscrl-gray);
      cursor: pointer;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: var(--gscrl-primary);
      color: var(--gscrl-dark);
    }
  </style>
</head>
<body>
  <div class="info-container">
    <div class="info-header">
      <div class="info-title">MECHANICAL <span class="highlight">MAYHEM</span></div>
      <div class="day-badge" id="dayBadge">Season 5 Opener &bull; October 3–4</div>
    </div>

    <!-- Overview panel -->
    <div class="content-panel" id="panelOverview">
      <div class="panel-label">Event Overview</div>
      <div class="overview-grid" id="overviewGrid">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Schedule panel -->
    <div class="content-panel" id="panelSchedule" style="display:none">
      <div class="panel-label" id="scheduleLabel">Season Opener Schedule &mdash; All times EDT</div>
      <div class="schedule-list" id="scheduleList">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Event partners panel -->
    <div class="content-panel" id="panelSponsors" style="display:none">
      <div class="panel-label">Event Partners &amp; Volunteers</div>
      <div class="sponsors-grid" id="sponsorsGrid"></div>
    </div>

    <div class="social-footer" id="socialFooter">
      <div class="social-item">&#128255; @gscrl</div>
      <div class="social-item">&#128247; @_gscrl</div>
      <div class="social-item">&#128172; discord.gg/qwkeeVWgs2</div>
      <div class="social-item">gscrl.org</div>
      <div class="social-item" id="bracketsLink" style="display:none">&#127942; robotcombatevents.com/events/9596</div>
    </div>
  </div>

  <!-- View selector (hide in OBS) -->
  <div class="view-selector obs-hide">
    <button class="view-btn active" data-view="overview">Overview</button>
    <button class="view-btn" data-view="schedule">Schedule</button>
    <button class="view-btn" data-view="sponsors">Partners</button>
  </div>

  <script src="event-config.js"></script>
  <script>
    const config = MechanicalMayhem.days[getEventDay()];
    document.getElementById('dayBadge').textContent = config.badge;
    document.getElementById('scheduleLabel').textContent = config.label + ' — All times EDT';
    const stats = [{value: '2026–27', label: 'Season 5'}, {value: String(config.classes.length), label: 'Classes Today'}, {value: '11 AM', label: 'Fights Begin'}];
    document.getElementById('overviewGrid').innerHTML = stats.map(s => '<div class="overview-stat"><div class="stat-value">'+s.value+'</div><div class="stat-label">'+s.label+'</div></div>').join('');
    document.getElementById('scheduleList').innerHTML = MechanicalMayhem.schedule.map(item => '<div class="schedule-item"><div class="schedule-time">'+item.time+'</div><div class="schedule-text"><div class="schedule-name">'+item.name+'</div></div></div>').join('');
    const sponsorGrid = document.getElementById('sponsorsGrid');
    const sponsors = MechanicalMayhem.sponsors.length ? MechanicalMayhem.sponsors : ['Thank you to our volunteers and event partners'];
    sponsorGrid.replaceChildren(...sponsors.map(name => { const el = document.createElement('div'); el.className = 'sponsor-card'; el.textContent = name; return el; }));
    document.getElementById('bracketsLink').style.display = '';
    function setView(view) {
      view = ['overview', 'schedule', 'sponsors'].includes(view) ? view : 'overview';
      for (const name of ['overview', 'schedule', 'sponsors']) document.getElementById('panel'+name[0].toUpperCase()+name.slice(1)).style.display = name === view ? '' : 'none';
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    }
    document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
    setView(new URLSearchParams(window.location.search).get('view'));
    applyEventColor();
    if (new URLSearchParams(window.location.search).get('hidecontrols') === 'true') document.querySelector('.view-selector').style.display = 'none';
</script>
</body>
</html>
