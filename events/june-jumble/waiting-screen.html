<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting - GSCRL June Jumble 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-4);
      box-sizing: border-box;
      overflow: hidden;
      background: linear-gradient(135deg, var(--gscrl-darker) 0%, var(--gscrl-dark) 100%);
    }

    .waiting-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 800px;
      width: 100%;
      gap: var(--space-6);
    }

    .waiting-logo {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      color: var(--gscrl-light);
      text-shadow: var(--glow-intensity) var(--glow-color);
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .waiting-subtitle {
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--gscrl-gray);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: calc(-1 * var(--space-4));
    }

    /* Event name */
    .event-name {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--gscrl-primary);
      text-shadow: var(--glow-intensity) var(--glow-color);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Spinning loader ring */
    .loader-ring {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .loader-ring svg {
      width: 100%;
      height: 100%;
      animation: spin 3s linear infinite;
    }

    .loader-ring .track {
      fill: none;
      stroke: rgba(255,255,255,0.07);
      stroke-width: 6;
    }

    .loader-ring .fill {
      fill: none;
      stroke: var(--gscrl-primary);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 188;
      stroke-dashoffset: 47;
      filter: drop-shadow(0 0 6px var(--gscrl-primary));
    }

    .loader-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: var(--text-xs);
      color: var(--gscrl-gray);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Status text */
    .status-text {
      font-family: var(--font-body);
      font-size: var(--text-lg);
      color: var(--gscrl-gray);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Info strip */
    .info-strip {
      display: flex;
      gap: var(--space-8);
      padding: var(--space-4) var(--space-6);
      background: rgba(26, 26, 46, 0.7);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
    }

    .info-label {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--gscrl-gray);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .info-value {
      font-family: var(--font-display);
      font-size: var(--text-base);
      color: var(--gscrl-light);
      letter-spacing: 0.05em;
    }

    /* Day badge */
    .day-badge {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      background: var(--gscrl-primary);
      color: var(--gscrl-dark);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Website */
    .website-text {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--gscrl-secondary);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="waiting-container">
    <div class="day-badge" id="dayBadge">Day 1 &bull; June 6, 2026</div>

    <div>
      <div class="waiting-logo">GSCRL</div>
      <div class="waiting-subtitle">Garden State Robot League</div>
    </div>

    <div class="event-name">June Jumble 2026</div>

    <div class="loader-ring">
      <svg viewBox="0 0 64 64">
        <circle class="track" cx="32" cy="32" r="30"/>
        <circle class="fill" cx="32" cy="32" r="30"/>
      </svg>
      <div class="loader-inner">SOON</div>
    </div>

    <div class="status-text" id="statusText">Stream starting soon&hellip;</div>

    <div class="info-strip">
      <div class="info-item">
        <div class="info-label">Venue</div>
        <div class="info-value">Warren County Balloon Festival</div>
      </div>
      <div class="info-item">
        <div class="info-label">Location</div>
        <div class="info-value">Washington, NJ</div>
      </div>
      <div class="info-item">
        <div class="info-label">Fights Begin</div>
        <div class="info-value">12:00 PM EDT</div>
      </div>
      <div class="info-item">
        <div class="info-label">Classes Today</div>
        <div class="info-value" id="classesEl">1lb Antweight &bull; 1lb Plastic Antweight</div>
      </div>
    </div>

    <div class="website-text">gscrl.org</div>
  </div>

  <script>
    const DAY_CONFIG = {
      1: {
        badge: 'Day 1 • June 6, 2026',
        classes: '1lb Antweight • 1lb Plastic Antweight',
      },
      2: {
        badge: 'Day 2 • June 7, 2026',
        classes: '3lb Beetleweight',
      }
    };

    function init() {
      const params = new URLSearchParams(window.location.search);
      const day = parseInt(params.get('day')) || 1;
      const config = DAY_CONFIG[day] || DAY_CONFIG[1];

      document.getElementById('dayBadge').textContent = config.badge;
      document.getElementById('classesEl').textContent = config.classes;

      if (params.has('status')) {
        document.getElementById('statusText').textContent = decodeURIComponent(params.get('status'));
      }

      if (params.has('color')) {
        const hex = '#' + params.get('color').replace('#', '');
        if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
          document.documentElement.style.setProperty('--gscrl-primary', hex);
          document.documentElement.style.setProperty('--glow-color', hex);
        }
      }
    }

    init();
  </script>
</body>
</html>
